openapi: "3.0.0"
info:
  title: "Groq API Stub"
  version: "1.0.0"
paths:
  /openai/v1/chat/completions:
    post:
      summary: "Create chat completion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                temperature:
                  type: number
                max_tokens:
                  type: integer
                stream:
                  type: boolean
            examples:
              chat_completion:
                value:
                  model: "llama-3.3-70b-versatile"
                  messages:
                    - role: "user"
                      content: "What is RAG?"
      responses:
        '200':
          description: "Successful completion"
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - object
                  - choices
                  - usage
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                            content:
                              type: string
                        finish_reason:
                          type: string
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
              examples:
                chat_completion:
                  value:
                    id: "chatcmpl-mock-001"
                    object: "chat.completion"
                    created: 1234567890
                    model: "llama-3.3-70b-versatile"
                    choices:
                      - index: 0
                        message:
                          role: "assistant"
                          content: "RAG stands for Retrieval Augmented Generation. It combines document retrieval with language model generation."
                        finish_reason: "stop"
                    usage:
                      prompt_tokens: 10
                      completion_tokens: 25
                      total_tokens: 35
