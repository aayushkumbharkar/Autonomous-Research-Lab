version: 3
dependencies:
  services:
    - service:
        definitions:
          - definition:
              source:
                filesystem:
                  directory: .
              specs:
                - groq_openapi.yaml
        runOptions:
          openapi:
            type: mock
            baseUrl: http://localhost:9000
specmatic:
  settings:
    mock:
      delayInMilliseconds: 0
      generative: false
